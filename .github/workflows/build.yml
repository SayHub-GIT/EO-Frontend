name: Frontend Build

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      NEXT_TELEMETRY_DISABLED: '1'
      NEXT_PUBLIC_API_URL: https://api.example.invalid/api

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate release preflight contract
        run: node --test scripts/test-release-config.test.mjs

      - name: Type check
        run: npx tsc --noEmit

      - name: Test attendance regressions
        run: npx tsx --test scripts/test-manual-check-in-eligibility.test.ts scripts/test-manual-check-in-confirmation.test.ts scripts/test-manual-check-out.test.ts scripts/test-attendance-mode-switch.test.ts scripts/test-attendance-list.test.ts scripts/test-attendance-list-filters.test.ts scripts/test-attendance-records-contract.test.ts scripts/test-attendance-records-ui.test.ts scripts/test-private-attendance-photo.test.ts scripts/test-attendance-refresh.test.ts scripts/test-qr-face-capture.test.ts scripts/test-qr-face-retry.test.ts scripts/test-qr-photo-check-in.test.ts scripts/test-workspace-sidebar.test.ts scripts/test-attendance-navigation.test.ts scripts/test-camera-mobile-accessibility.test.ts scripts/test-attendance-mobile-accessibility.test.ts scripts/test-admin-keyboard-responsive.test.ts scripts/test-attendance-search-scoped.test.ts scripts/test-attendance-operator-workspace.test.ts scripts/test-attendance-401-no-replay.test.ts

      # The repository currently has legacy formatting-only ESLint debt across
      # unrelated pages. Keep compilation/type safety as a reliable merge gate
      # without making existing whitespace/import-order debt block all PRs.
      - name: Production build
        run: npx next build --no-lint

  windows-dependency-recovery:
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Simulate stale Chart.js and auto-recover using the lockfile
        shell: pwsh
        run: |
          Remove-Item -Recurse -Force node_modules/chart.js
          node scripts/ensure-chartjs.mjs
          node -e "require.resolve('chart.js/auto')"

      - name: Type check after recovery
        run: npx tsc --noEmit
